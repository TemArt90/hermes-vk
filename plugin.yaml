name: vk-platform
label: VK
kind: platform
version: 1.2.0
description: >
  VK (ВКонтакте) gateway adapter for Hermes Agent.
  Connects Hermes to a VK community bot through the Bots Long Poll API —
  no public URL, no domain, no webhook. Works from RF networks without a proxy.
  Ported from the openclaw-vk channel plugin.
author: Hermes Agent
requires_env:
  - name: VK_TOKEN
    description: "Ключ доступа сообщества (VK community access token) с правами «Сообщения сообщества» и «Управление сообществом»"
    prompt: "VK community token"
    url: "https://dev.vk.com/ru/api/bots/getting-started"
    password: true
optional_env:
  - name: VK_HOME_CHANNEL
    description: "VK id (peer id) для доставки cron-отчётов, например 1234567"
    prompt: "Home peer id"
    password: false
  - name: VK_ALLOWED_USERS
    description: "VK id пользователей, которым разрешено писать боту (через запятую)"
    prompt: "Allowed VK ids (comma-separated)"
    password: false
  - name: VK_ALLOW_ALL_USERS
    description: "Разрешить писать боту любому пользователю VK (только для тестов)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: VK_GROUP_ID
    description: "ID сообщества (определяется автоматически из токена; укажите только если токен общий)"
    prompt: "Community id (optional)"
    password: false
  - name: VK_COMMAND_KEYBOARD
    description: "Показывать клавиатуру с командами (/help, /status, /new, /stop): тап отправляет команду"
    prompt: "Show a command keyboard? (true/false)"
    password: false
  - name: VK_QUOTE_IN_GROUPS
    description: "Цитировать входящее сообщение при ответе в беседе (по умолчанию true)"
    prompt: "Quote in group chats? (true/false)"
    password: false
  - name: VK_API_VERSION
    description: "Версия VK API (по умолчанию 5.199)"
    prompt: "API version"
    password: false
  - name: VK_REQUIRE_MENTION
    description: "В беседах отвечать только когда бота упомянули (по умолчанию false — отвечает на все сообщения)"
    prompt: "Require a mention in group chats? (true/false)"
    password: false
  - name: VK_REQUIRE_MENTION_BY_PEER
    description: "Переопределить упоминание для конкретных бесед: «peer_id:true,peer_id:false» (остальные наследуют общий флаг)"
    prompt: "Per-chat mention overrides"
    password: false
  - name: VK_MENTION_PATTERNS
    description: "Свои шаблоны упоминания (через запятую) вместо автоматических: по id сообщества и его имени"
    prompt: "Custom mention patterns"
    password: false
  - name: VK_DOWNLOAD_ATTACHMENTS
    description: "Скачивать вложения из чата в кэш агента (по умолчанию true). Выключите, если бот не должен принимать файлы"
    prompt: "Download inbound attachments? (true/false)"
    password: false
  - name: VK_MAX_ATTACHMENT_BYTES
    description: "Предел размера скачиваемого вложения в байтах (по умолчанию 20971520 = 20 МБ)"
    prompt: "Max inbound attachment size in bytes"
    password: false
