# Test configuration for the VK platform plugin.
#
# NOT pyproject.toml — deliberately. Hermes's plugin manager (pm/plugin_declarations.py)
# treats any pyproject.toml inside a plugin directory as a real packaging project: it copies
# the plugin to plugin-sources/<plugin>-<hash>/ and runs `uv lock`. A config-only file with no
# [project].name/version makes that fail and the plugin gets DISABLED. pytest.ini is not one of
# the names PM inspects (pyproject.toml / setup.py / setup.cfg), so the suite can live here safely.
#
# Canonical run:
#     cd ~/.hermes/hermes-agent && venv/bin/python -m pytest ~/.hermes/plugins/platforms/vk -q

[pytest]
testpaths = tests
cache_dir = .pytest_cache
# `..` is the plugin's parent, which is what makes `from vk.…` resolve. The Hermes runtime behind
# `from gateway.…` is located in tests/conftest.py — it cannot be hard-coded in a published repo.
pythonpath = ..
# Any warning fails the run. NOT `error::RuntimeWarning`: an un-awaited coroutine warns from its
# destructor, which a category-scoped filter does not catch (measured — the test still passed), while a
# bare `error` does (pytest routes it through its unraisable-exception plugin). That hole made the dedup
# assertion pass vacuously once, so it is worth the strictness.
filterwarnings =
    error
