name: tests

# Runs the plugin's suite on a clean GitHub machine: a fresh PyPI/OS environment, the plugin checked out
# under its repository name (which is NOT `vk` — exactly the layout that once broke test collection), and
# a freshly cloned Hermes runtime for the `gateway.*` imports. No secrets: the live-loop test mocks VK on
# localhost and never touches the network, so nothing here can reach a real community.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04   # pinned: `latest` migrates to Ubuntu 26 in Oct 2026
    strategy:
      fail-fast: false
      matrix:
        # Two Hermes revisions side by side: current main and the oldest release the plugin claims
        # to support (v2026.9.14 is 0.21.3). A change that reaches for a newer internal API then
        # fails here instead of on a user's install — and the `requires_hermes` floor in the plugin
        # catalogue entry stays a measured fact rather than a guess.
        hermes_ref: [main, v2026.9.14]
    env:
      # tests/_paths.py resolves the Hermes runtime from here
      HERMES_INSTALL: ${{ github.workspace }}/.ci-hermes
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # the interpreter the plugin is developed against

      - name: Clone the Hermes runtime (${{ matrix.hermes_ref }})
        run: git clone --depth 1 --branch "${{ matrix.hermes_ref }}" https://github.com/NousResearch/hermes-agent.git "$HERMES_INSTALL"

      - name: Install test dependencies
        # Hermes' own dependency set is not pulled by a plain checkout, so the CI carries the slice the
        # tests actually touch: `hermes_yaml` imports ruamel.yaml, the transport is aiohttp, and the table
        # converter reaches Hermes' agent.markdown_tables, which needs wcwidth. PyYAML is what the older
        # Hermes revision imports directly (as `yaml`); current main routes YAML through hermes_yaml, so
        # only the v2026.9.14 job strictly needs it — installing it in both keeps one recipe. Add here when
        # a test pulls in a new Hermes-internal dependency — the failing step names it.
        #
        # Versions are PINNED to the developer's venv on purpose. Unpinned, an upstream release of any of
        # these turns a green run red with no change on our side, and the failure names a dependency rather
        # than our code — so a red CI stops meaning "we broke something". Bump deliberately, together with
        # the venv, and let the matrix prove the older Hermes revision still works.
        run: >-
          python -m pip install --upgrade pip
          pytest==9.1.1
          aiohttp==3.14.3
          ruamel.yaml==0.18.17
          wcwidth==0.6.0
          PyYAML==6.0.3

      - name: Run the suite
        run: python -m pytest -q
